worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80 default_server;
        server_name poker.card.game 127.0.0.1 localhost;
        client_max_body_size 10m;

        location / {
            return 301 https://$host$request_uri;
        }
    }
     
     server {
        listen 443 ssl;
        server_name poker.card.game 127.0.0.1 localhost;
    ssl_certificate "C:/Users/dayan/OneDrive/Documents/EPT-DEVOPS-L-A-02/ssl/server.crt";
    ssl_certificate_key "C:/Users/dayan/OneDrive/Documents/EPT-DEVOPS-L-A-02/ssl/server.key";
    location / {
proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            
            proxy_read_timeout 60s;
    }
     }
}
